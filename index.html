<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ellison Games — Pick a Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;padding:28px 16px 44px;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;
  background:radial-gradient(circle at 15% 0%,#40297a,#1c1236 55%,#0b0718 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
h1{margin:0;font-size:clamp(30px,8vw,48px);letter-spacing:1px;text-shadow:3px 3px 0 #000,0 0 26px #ffd93b}
.sub{margin:0 0 10px;color:#c9baf5;font-size:15px}
.games{width:100%;max-width:470px;display:flex;flex-direction:column;gap:20px}
.game{display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:inherit;
  padding:16px;border-radius:26px;border:4px solid #12081f;
  box-shadow:0 10px 0 #12081f,0 18px 32px rgba(0,0,0,.45);
  transition:transform .09s ease,box-shadow .09s ease}
.game:hover{transform:translateY(-3px);box-shadow:0 13px 0 #12081f,0 24px 36px rgba(0,0,0,.5)}
.game:active{transform:translateY(7px);box-shadow:0 3px 0 #12081f,0 8px 16px rgba(0,0,0,.45)}
.chef{background:linear-gradient(160deg,#ffe066,#ff9f43 70%,#ff7a18)}
.tube{background:linear-gradient(160deg,#9be7ff,#4aa8ff 55%,#b06bff)}
.icon{position:relative;flex:0 0 82px;width:82px;height:82px;border-radius:22px;display:grid;place-items:center;
  font-size:44px;line-height:1;background:#fff;border:3px solid #12081f;box-shadow:inset 0 -7px 0 rgba(0,0,0,.13)}
.icon em{position:absolute;right:-8px;bottom:-6px;font-size:24px;font-style:normal;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.text h2{margin:0 0 4px;font-size:23px;line-height:1.1;color:#12081f;text-shadow:1px 1px 0 rgba(255,255,255,.55)}
.text small{display:block;font-size:12.5px;font-weight:bold;color:#3c2600;opacity:.9;line-height:1.35}
.tube .text small{color:#10263d}
.tag{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;background:#12081f;color:#ffd93b;
  font-size:10.5px;font-weight:bold;letter-spacing:.6px}
footer{margin-top:8px;color:#8f83b8;font-size:12px}
</style>
</head>
<body>
<h1>🎮 Ellison Games</h1>
<p class="sub">Pick a game and let's play!</p>

<div class="games">
  <a class="game chef" href="chef-pigeon-2.html">
    <div class="icon">🐦‍⬛<em>🍞</em></div>
    <div class="text">
      <h2>Chef Pigeon 2</h2>
      <small>Catch the bread, dodge the eggs, beat the pigeon bosses.</small>
      <span class="tag">2 STAGES • 47 COLLECTIBLES</span>
    </div>
  </a>

  <a class="game tube" href="pigeon-tube.html">
    <div class="icon">🐦<em>📺</em></div>
    <div class="text">
      <h2>Pigeon Tube</h2>
      <small>Post videos, grow your channel, defend the tower.</small>
      <span class="tag">TOWER DEFENSE • SHADERS</span>
    </div>
  </a>
</div>

<footer>More games coming soon…</footer>
</body>
</html>
